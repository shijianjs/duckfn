#
# Builds the Docusaurus site in docs/ and publishes it to GitHub Pages.
#
# Triggered by a version tag (`v*.*.*`) or manually from the Actions tab; ordinary commits do not
# build the site.
#
# The `github-pages` environment is protected, so the refs that may deploy are listed in
# Settings -> Environments -> github-pages -> Deployment branches and tags (currently: branch
# `main`, tag `v*.*.*`). Any other ref is rejected with
#   Tag "vX.Y.Z" is not allowed to deploy to github-pages due to environment protection rules.
# — the deploy job below skips such a run instead of failing.
#
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
#
name: Deploy Docs
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

# Required by actions/deploy-pages: it exchanges the OIDC token for a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two Pages deployments race; the later one wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # Resolves the Pages base URL, honouring a custom domain when one is configured.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build site
        working-directory: docs
        # A project site is served from /<repo>/, so Docusaurus is told the real url/baseUrl
        # instead of relying on the local-development fallbacks in docusaurus.config.ts.
        run: |
          set -euo pipefail
          # `base_url` is "https://<host>/<path>" and Docusaurus rejects it: `url` must be a bare
          # origin, the sub-path belongs in `baseUrl` ("" -> "/" when the site sits at the root).
          base_path='${{ steps.pages.outputs.base_path }}'
          export DOCS_URL='${{ steps.pages.outputs.origin }}'
          export DOCS_BASE_URL="${base_path%/}/"
          echo "Building for DOCS_URL=$DOCS_URL DOCS_BASE_URL=$DOCS_BASE_URL"
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/build

  # Deploys only from the refs whitelisted in the `github-pages` environment; anything else (say a
  # manual run started from a feature branch) stops after the build job above.
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref_type == 'tag' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
