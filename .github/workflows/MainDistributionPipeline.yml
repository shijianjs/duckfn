#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
# Pushing a version tag (e.g. v0.0.17) builds the extension for every supported platform and then publishes a
# GitHub Release for that tag, with all built extension binaries attached as release assets.
#
name: Main Extension Distribution Pipeline
on:
#  push:
#    branches: [main]
  pull_request:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      # 扩展并进根包后由 `quack` feature 打开（根 Makefile 里 `TARGET_INFO += --features quack`）；
      # 这个名字必须与根 Makefile 的 EXTENSION_NAME、test/extension/entry.rs 的 duckfn_entrypoint!
      # 一致。
      #
      # The extension lives in the root package behind the `quack` feature (see the root Makefile's
      # `TARGET_INFO += --features quack`); the name has to match EXTENSION_NAME in that Makefile and
      # duckfn_entrypoint! in test/extension/entry.rs.
      extension_name: duckfn
      extra_toolchains: rust;python3
      exclude_archs: 'linux_amd64_musl'

  # Publishes a GitHub Release for the pushed version tag and attaches every extension binary built above.
  # Runs on version tags only; a `workflow_dispatch` started from a tag ref also matches.
  github-release:
    name: Publish GitHub Release
    needs: duckdb-stable-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EXTENSION_NAME: duckfn
      DUCKDB_VERSION: v1.5.6
    steps:
      # Needed to list the commits since the previous version tag when building the release notes.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Download extension artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: 'duckfn-*-extension-*'
          path: artifacts

      - name: Collect extension binaries
        run: |
          set -euo pipefail
          mkdir -p release-assets
          prefix="${EXTENSION_NAME}-${DUCKDB_VERSION}-extension-"
          found=0
          while IFS= read -r file; do
            case "$file" in
              *.duckdb_extension.wasm) suffix=".duckdb_extension.wasm" ;;
              *.duckdb_extension)      suffix=".duckdb_extension" ;;
              *) continue ;;
            esac
            artifact="${file#artifacts/}"
            artifact="${artifact%%/*}"
            arch="${artifact#"$prefix"}"
            arch="${arch%.wasm}"
            cp "$file" "release-assets/${EXTENSION_NAME}-${arch}${suffix}"
            found=$((found + 1))
          done < <(find artifacts -type f \( -name '*.duckdb_extension' -o -name '*.duckdb_extension.wasm' \) | sort)
          if [ "$found" -eq 0 ]; then
            echo "::error::no extension binaries found in the downloaded artifacts"
            exit 1
          fi
          ls -l release-assets

      # Commit list since the previous version tag. GitHub's own notes are PR based, and this repository
      # pushes straight to main, so on their own they would only contain a compare link.
      - name: Build release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prev_tag=$(git describe --tags --abbrev=0 --match 'v*' --exclude "$TAG" 2>/dev/null || true)
          if [ -n "$prev_tag" ]; then
            {
              echo "## Changes since ${prev_tag}"
              echo
              # Skip the version bump commit itself, it carries no information for the release.
              git log --no-merges --pretty='- %s (%h)' "${prev_tag}..${TAG}" | grep -vE '^- chore\(release\)' || true
            } > release-notes.md
            echo "release notes built from ${prev_tag}..${TAG}"
          else
            echo "no previous version tag found, falling back to GitHub-generated notes"
          fi

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            notes_args=()
            if [ -s release-notes.md ]; then
              notes_args+=(--notes-file release-notes.md)
            fi
            gh release create "$TAG" release-assets/* --title "$TAG" --generate-notes "${notes_args[@]}"
          fi

  # Publishes both library crates to crates.io, once the binaries are built and the GitHub Release
  # exists. Mirrors the local `just release_publish`, except that it authenticates through crates.io
  # trusted publishing (OIDC) instead of a long-lived token.
  #
  # The gate is deliberately narrower than the one on `github-release`: that job also accepts a
  # `workflow_dispatch` started from a tag ref, but a crates.io version can never be deleted (only
  # yanked), so this job runs on a version tag *push* and nothing else — dispatching the workflow on
  # main builds and releases nothing, and never publishes.
  publish-crates:
    name: Publish crates
    needs: github-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Exchange the workflow's OIDC token for a short-lived crates.io token.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Rust
        run: |
          set -euo pipefail
          # The runner image already ships rustup; no third-party setup action needed.
          rustup default stable
          cargo --version
          rustc --version

      # `cargo publish` decides *what* to upload from the manifests, the tag only decides *that*
      # something is uploaded. Letting them disagree would publish a version nobody tagged.
      - name: Check the tag matches the workspace version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "duckfn") | .version')
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::tag ${TAG} does not match the workspace version v${version} — run just release_bump first"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "publishing duckfn-macro@${version}, then duckfn@${version}"

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Publish duckfn-macro
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          # Same sequence as `just publish_macro_dry` + `just publish_macro`: verify the crate
          # builds from the packaged sources before the upload, which cannot be undone.
          cargo publish -p duckfn-macro --registry crates-io --dry-run
          cargo publish -p duckfn-macro --registry crates-io

      # `duckfn` depends on `duckfn-macro = "=X.Y.Z"`, and publishing builds the dependency graph
      # from the registry rather than from the local path. The sparse index needs a moment to carry
      # the version just uploaded, so poll it instead of racing it — this is the same race the
      # local flow hits ("failed to select a version for the requirement duckfn-macro = ...").
      - name: Wait for duckfn-macro to reach the index
        run: |
          set -euo pipefail
          url='https://index.crates.io/du/ck/duckfn-macro'
          for attempt in $(seq 1 40); do
            if curl -sf "$url" | grep -q "\"vers\":\"${VERSION}\""; then
              echo "duckfn-macro@${VERSION} is in the index"
              exit 0
            fi
            echo "attempt ${attempt}/40: duckfn-macro@${VERSION} not in the index yet, retrying in 15s"
            sleep 15
          done
          echo "::error::duckfn-macro@${VERSION} did not reach the index within 10 minutes"
          exit 1

      - name: Publish duckfn
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          cargo publish -p duckfn --registry crates-io --dry-run
          cargo publish -p duckfn --registry crates-io
