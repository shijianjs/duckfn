#
# Stages duckfn-docs-kit on npm through OpenID Connect — npm's "trusted publisher"
# flow, using staged publishing as the approval step. Pushing a `docs-kit-v*` tag is
# what starts the release: there is no npm token in this repository, no `npm publish`
# on a laptop, and no OTP prompt here. A maintainer still has to approve the staged
# version with 2FA before it goes live; see duckfn-docs-kit/CONVENTIONS.md
# ("发版流程（npm）") for the surrounding steps.
#
# Three things outside this file have to line up; all three are case-sensitive:
#
#   1. On npmjs.com -> duckfn-docs-kit -> Settings -> Trusted publishing, a GitHub
#      Actions publisher for shijianjs/duckfn whose workflow filename is exactly
#      `PublishDocsKit.yml`. Leave "Allowed actions" at its default: a trusted
#      publisher may always run `npm stage publish`, and *not* ticking the direct
#      `npm publish` box is the stronger setting — a compromised workflow can then
#      only propose a version, never ship one. Nothing here needs that box, because
#      the step below stages instead of publishing.
#   2. The runner must be GitHub-hosted (OIDC is not issued to self-hosted runners).
#   3. The job needs `id-token: write`, below — without it npm falls back to token
#      auth and fails with ENEEDAUTH.
#
# Provenance attestations come for free: an OIDC publish from a public repository
# generates one automatically, so `--provenance` is deliberately absent.
name: Publish docs-kit

on:
  push:
    # Matches the tag `just release_kit_tag` pushes (`docs-kit-v*`, never `v*.*.*`),
    # so the Rust pipeline's tag filter and this one cannot pick up each other's tags.
    tags: ['docs-kit-v*']

permissions:
  contents: read
  # Exchange the workflow's OIDC token for a short-lived publish credential.
  id-token: write

# Two runs for the same version cannot both succeed, but they can race; the later
# one is the one that should wait.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Stage on npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Needs >= 22.14.0; npm ships the CLI that speaks OIDC, which is checked below.
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Never cache a release build: the artifact that gets staged should not
          # depend on whether the cache happened to survive.
          package-manager-cache: false

      # `npm stage` itself only exists from 11.15.0 on, and anything older than 11.5.1
      # does not do the OIDC handshake at all. Such a CLI would fall back to token auth
      # and fail with ENEEDAUTH, which reads like a broken trusted publisher
      # configuration rather than an outdated CLI — so fail early, and say why.
      - name: Check the npm CLI can stage-publish through a trusted publisher
        run: |
          set -euo pipefail
          need=11.15.0
          have=$(npm --version)
          echo "node $(node --version), npm ${have} (need >= ${need})"
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -n1)" != "$need" ]; then
            echo "::error::npm ${have} cannot stage-publish through a trusted publisher (needs >= ${need})"
            exit 1
          fi

      - name: Install dependencies
        # Installs the whole workspace from the root (docs + duckfn-docs-kit).
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -w duckfn-docs-kit

      # The tests run against dist/ (they are Node-side and this package has no TS
      # loader), so build first — `npm stage publish` builds again through `prepack`,
      # which is cheap next to the alternative of not testing at all. `release_kit_check`
      # runs the same two steps locally before a tag is pushed.
      - name: Build
        run: npm run build -w duckfn-docs-kit

      - name: Test
        run: npm test -w duckfn-docs-kit

      # The tag decides *that* a release happens, the manifest decides *what* is
      # staged. Letting them disagree would put a version in the staging area that its
      # tag does not describe.
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./duckfn-docs-kit/package.json').version")
          expected="docs-kit-v${version}"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::tag ${TAG} does not match ${expected} — run just release_kit_bump first"
            exit 1
          fi
          echo "staging duckfn-docs-kit@${version}"

      - name: Stage the publish
        # `prepack` builds dist/ first, the same way the local flow does; the registry
        # is the default public one, so no --registry and no token. npm prints
        # "staged with id <stage-id>" here — approving that id is what ships it.
        run: npm stage publish -w duckfn-docs-kit

      # The run is green before the version is live, so the run page has to say so.
      - name: What happens next
        run: |
          {
            echo "### Staged on npm — approval still required"
            echo
            echo "\`npm stage publish\` does not put the version on the registry; it waits in the"
            echo "staging area until a maintainer approves it with 2FA:"
            echo
            echo '```bash'
            echo "npm stage list                 # list staged versions you can approve"
            echo "npm stage approve <stage-id>   # approve and publish (needs 2FA)"
            echo '```'
            echo
            echo "Or use the **Staged Packages** tab on npmjs.com."
          } >> "$GITHUB_STEP_SUMMARY"
