# 固定构建用的 Rust 工具链（本仓库自己编产物时生效；下游依赖 duckfn 不继承它）。
#
# 官方 ci-tools 的 v2.0-cyanoptera 已经把 Rust 钉在 1.97.1，这里写同一个版本，让本地构建与 CI 使用
# 同一个 rustc；workspace 要求的 rustc 下限见根 Cargo.toml 的 rust-version。
#
# 为什么不是更低的版本：较新的 stable 才给 wasm32-unknown-emscripten 的预编译 std 带上展开运行时，
# 于是 `catch_unwind` 在浏览器里也能把 panic 转成可读错误（实测见 docs 的 known-issues
# 「A panic! inside a function on WebAssembly」）。
#
# 本文件与 Makefile 的 -O0 链接覆盖是一套：Rust >= 1.89 的 wasm 产物可能带 call-indirect-overlong，
# 2.0 分支的 wasm-opt 仍不接受 emcc 递过去的参数，所以 wasm 链接继续走 -O0（详见
# docs/docs/duckdb-versions/wasm-toolchain.md）。
#
# Pins the Rust used to build this repository (downstream dependencies on duckfn do not inherit it).
# ci-tools' v2.0-cyanoptera already pins 1.97.1; this file keeps local builds on the same rustc. A
# recent stable ships the wasm32-unknown-emscripten std *with* unwinding, so catch_unwind works in the
# browser. Keep it together with the Makefile's -O0 wasm link override.
[toolchain]
channel = "1.97.1"
targets = ["wasm32-unknown-emscripten"]
