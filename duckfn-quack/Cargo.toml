[package]
name = "duckfn_quack"
version = "0.1.0"
edition = "2021"
# 示例插件项目：仅用于演示 duckfn，不发布到 crates.io。
# 它同时被 include 进根 crate（duckfn）的发布包里，作为随包发行的示例与测试。
#
# Example plugin: it only demonstrates duckfn and is never published to crates.io on its own;
# it is packaged into the root crate (duckfn) as the example extension shipped with it.
publish = false

[lib]
crate-type = ["cdylib"]

# 注意：这里不能声明 [profile.*]。profile 只在 workspace 根的 Cargo.toml 生效，
# release 的 lto / strip 写在根清单里，对本 crate 一样适用。
#
# Note: no [profile.*] here. Profiles only apply when declared in the workspace root manifest;
# the root manifest carries the release `lto` / `strip` settings, which cover this crate too.

[[example]]
# crate-type can't be (at the moment) be overriden for specific targets
# src/wasm_lib.rs forwards to src/lib.rs so that we can change from cdylib
# (that is needed while compiling natively) to staticlib (needed since the
# actual linking will be done via emcc
name = "duckfn_quack"
path = "src/wasm_lib.rs"
crate-type = ["staticlib"]

[dependencies]
#duckdb = { version = "~1.10504.0", features = ["loadable-extension", "vscalar"] }
quack-rs = "0.16.0"
# loadable-extension 功能
# libduckdb-sys 加上 features = ["loadable-extension"] 从根本上改变了 DuckDB API 函数的工作方式：
# Without feature:  duckdb_query(...)  →  calls linked libduckdb directly
# With feature:     duckdb_query(...)  →  dispatches through an AtomicPtr table
# AtomicPtr 表初始值为空。DuckDB 通过调用来填充它。 duckdb_rs_extension_api_init 。
# headers only — no linked library
#libduckdb-sys = { version = ">=1.4.4, <2", features = ["loadable-extension"] }
libduckdb-sys = { version = "1.10505.0", features = ["loadable-extension"] }
tuple-transpose = "0.1.0"
# 示例 crate 打开 duckfn 的互转 feature（时间包装类型 <-> chrono、DuckUuid <-> uuid、
# DuckDecimal <-> rust_decimal）；duckfn 不 re-export 这三个 crate，因此用到它们类型的地方要自己
# 依赖。chrono 这里同样只要核心类型 + std：不需要 clock（取系统时间，会带上 iana-time-zone /
# wasm-bindgen 等一串依赖，wasm 构建也更容易出岔子）。
#
# The example crate enables duckfn's interop features (time wrapper types <-> chrono, DuckUuid <->
# uuid, DuckDecimal <-> rust_decimal). duckfn re-exports none of those three crates, so depending on
# them directly is up to the crate that names their types. chrono is trimmed the same way here —
# core types plus `std`, no `clock` (system time, which drags in iana-time-zone / wasm-bindgen and
# complicates the wasm build).
#
# `cli` 打开 duckfn 的命令行工具（src/bin/duckfn.rs 用）：
#   cargo run -p duckfn_quack --bin duckfn -- function_descriptions
# 它给 duckfn 带上 clap 与 csv 两个依赖；不需要这个工具的项目可以去掉。
#
# `cli` enables duckfn's command-line tool, used by src/bin/duckfn.rs:
#   cargo run -p duckfn_quack --bin duckfn -- function_descriptions
# It adds clap and csv to duckfn's dependency tree; projects that never run the tool can drop it.
duckfn = { path = "..", features = ["duckdb-1-5", "chrono", "uuid", "rust_decimal", "cli"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid = "1"
rust_decimal = "1"
indexmap = "2"
