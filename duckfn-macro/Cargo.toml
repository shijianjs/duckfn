[package]
name = "duckfn-macro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Procedural macros for duckfn: generate DuckDB scalar, aggregate and table functions, SQL macros and STRUCT types from plain Rust code."
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/duckfn-macro"
keywords = ["duckdb", "macro", "proc-macro", "extension", "ffi"]
categories = ["database", "development-tools::ffi"]

[lib]
proc-macro = true

[dependencies]
# 官方wasm ci报错：
# error: rustc 1.86.0 is not supported by the following packages:
# darling@0.23.0 requires rustc 1.88.0
darling = "0.21.3"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = "2.0.119"