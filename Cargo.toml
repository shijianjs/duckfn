[package]
name = "rusty_quack"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true
panic = "abort"             # required — panics across FFI are undefined behavior
opt-level = 3
codegen-units = 1

[[example]]
# crate-type can't be (at the moment) be overriden for specific targets
# src/wasm_lib.rs forwards to src/lib.rs so that we can change from cdylib
# (that is needed while compiling natively) to staticlib (needed since the
# actual linking will be done via emcc
name = "rusty_quack"
path = "src/wasm_lib.rs"
crate-type = ["staticlib"]

[dependencies]
duckdb = { version = "~1.10504.0", features = ["loadable-extension", "vscalar"] }
quack-rs = "0.16.0"
# loadable-extension 功能
# libduckdb-sys 加上 features = ["loadable-extension"] 从根本上改变了 DuckDB API 函数的工作方式：
# Without feature:  duckdb_query(...)  →  calls linked libduckdb directly
# With feature:     duckdb_query(...)  →  dispatches through an AtomicPtr table
# AtomicPtr 表初始值为空。DuckDB 通过调用来填充它。 duckdb_rs_extension_api_init 。
# headers only — no linked library
libduckdb-sys = { version = ">=1.4.4, <2", features = ["loadable-extension"] }
tuple-transpose = "0.1.0"

