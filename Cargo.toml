[package]
name = "rusty_quack"
version = "0.1.0"
edition = "2021"
# 示例插件项目：仅用于演示 duckfn，不发布到 crates.io。
# 保留在本仓库根目录是为了复用 DuckDB 官方 CI 自动构建各平台的扩展包。
publish = false

[workspace]
resolver = "3"
members = ["duckfn", "duckfn-macro","."]

[workspace.package]
version = "0.0.8-dev.0"
edition = "2024"
rust-version = "1.86"
license = "MIT"
repository = "https://github.com/shijianjs/duckfn"
homepage = "https://github.com/shijianjs/duckfn"
authors = ["shijianjs"]

[lib]
crate-type = ["cdylib"]

[profile.release]
## 下面两个官方模板的
lto = true
strip = true

## 下面三个是quack-rs加的
#panic = "abort"             # required — panics across FFI are undefined behavior
#opt-level = 3
#codegen-units = 1

[[example]]
# crate-type can't be (at the moment) be overriden for specific targets
# src/wasm_lib.rs forwards to src/lib.rs so that we can change from cdylib
# (that is needed while compiling natively) to staticlib (needed since the
# actual linking will be done via emcc
name = "rusty_quack"
path = "src/wasm_lib.rs"
crate-type = ["staticlib"]

[dependencies]
#duckdb = { version = "~1.10504.0", features = ["loadable-extension", "vscalar"] }
quack-rs = "0.16.0"
# loadable-extension 功能
# libduckdb-sys 加上 features = ["loadable-extension"] 从根本上改变了 DuckDB API 函数的工作方式：
# Without feature:  duckdb_query(...)  →  calls linked libduckdb directly
# With feature:     duckdb_query(...)  →  dispatches through an AtomicPtr table
# AtomicPtr 表初始值为空。DuckDB 通过调用来填充它。 duckdb_rs_extension_api_init 。
# headers only — no linked library
#libduckdb-sys = { version = ">=1.4.4, <2", features = ["loadable-extension"] }
libduckdb-sys = { version = "1.10505.0", features = ["loadable-extension"] }
tuple-transpose = "0.1.0"
# 示例 crate 打开 duckfn 的 chrono feature（时间包装类型 <-> chrono 互转）；duckfn 不 re-export
# chrono，因此用到 chrono 类型的地方要自己依赖它。chrono 这里同样只要核心类型 + std：不需要
# clock（取系统时间，会带上 iana-time-zone / wasm-bindgen 等一串依赖，wasm 构建也更容易出岔子）。
#
# The example crate enables duckfn's `chrono` feature (time wrapper types <-> chrono). duckfn does
# not re-export chrono, so depending on it directly is up to the crate that names chrono types.
# chrono is trimmed the same way here — core types plus `std`, no `clock` (system time, which drags
# in iana-time-zone / wasm-bindgen and complicates the wasm build).
duckfn = { path = "duckfn", features = ["duckdb-1-5", "chrono"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
indexmap = "2"

