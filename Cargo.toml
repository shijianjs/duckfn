[package]
name = "duckfn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Write DuckDB extensions in plain Rust: attribute macros that turn ordinary functions into scalar/aggregate/table functions, SQL macros and nested LIST/MAP/ARRAY/STRUCT types."
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
# crates.io's "Documentation" link should land on the user guide rather than on docs.rs.
documentation = "https://shijianjs.github.io/duckfn/"
keywords = ["duckdb", "extension", "ffi", "database", "macro"]
categories = ["database", "api-bindings", "development-tools::ffi"]

# 打包白名单（crate 根就是仓库根，不显式列出就会连 docs/node_modules 一起打进去）。
# 三条必须遵守的规则：
#
# 1. 模式必须以 `/` 开头。gitignore 风格里裸的 `LICENSE` / `README.md` 会匹配**任意层级**的
#    同名文件，于是 docs/node_modules/**/LICENSE、configure/venv/**/LICENSE 全被收进包
#    （实测 1600 多个文件）；`/LICENSE` 才是只匹配包根目录。
# 2. 写了 include 就**绕过 gitignore**，所以测试残留得自己挡：sqllogictest 会在 test/sql 下写出
#    dfn_file_*、dfn_copy_*.tsv 之类的临时文件，因此这里只收 `.test` 用例本身。
# 3. cargo 无条件跳过任何**含 Cargo.toml 的子目录**（Cargo Book："Any subdirectory that
#    contains a `Cargo.toml` file"），且不受 include 模式影响。这就是 `duckfn-macro/` 不在这里
#    列出的原因 —— 它是独立 crate、单独发布。示例扩展已经并进本包（test/extension/、
#    src/bin/duckfn.rs、test/sql/），所以能随包一起发布。
#
# 除了运行时代码与测试，包内含全量文档站正文（英文 + 简体中文）与示例扩展及其用例，这样解包即得
# 完整文档和可运行的示例，阅读或喂给 AI 都不必再克隆仓库。
#
# The packaging whitelist. Three rules to respect:
#
# 1. Patterns must start with `/`. In gitignore syntax a bare `LICENSE` / `README.md` matches files
#    with that name at *any* depth, which swept in docs/node_modules/**/LICENSE and
#    configure/venv/**/LICENSE (1600+ files in a test run); `/LICENSE` matches the package root only.
# 2. Specifying `include` **bypasses gitignore**, so the test residue has to be kept out by hand: the
#    sqllogictest suite writes temporary files (dfn_file_*, dfn_copy_*.tsv, ...) into test/sql, hence
#    only the `.test` files themselves are taken.
# 3. cargo unconditionally skips any subdirectory containing a `Cargo.toml` (Cargo Book: "Any
#    subdirectory that contains a `Cargo.toml` file"), and no `include` pattern overrides that. That
#    is why `duckfn-macro/` is not listed here — it is a crate of its own, published separately. The
#    example extension now lives inside this package (test/extension/, src/bin/duckfn.rs, test/sql/)
#    and therefore ships with it.
#
# Besides the runtime and its tests the package carries the whole documentation site (English and
# Simplified Chinese) and the example extension with its sqllogictest suite, so unpacking the crate
# is enough to read the docs and run the example without cloning.
include = [
    "/Cargo.toml",
    "/src/**",
    "/tests/**",
    "/test/extension/**",
    "/examples/**",
    "/test/sql/**/*.test",
    "/demo.sh",
    "/README.md",
    "/README.zh-CN.md",
    "/LICENSE",
    "/docs/README.md",
    "/docs/docs/**",
    "/docs/i18n/zh-Hans/docusaurus-plugin-content-docs/current/**",
]

[workspace]
resolver = "3"
# 示例扩展并进根包后，workspace 里只剩过程宏这一个成员；它不写进这里也行（路径依赖会自动成为
# 成员），列出来只是更直白。根包 duckfn 不是成员，而是 workspace 根包。
#
# With the example extension folded into the root package, the procedural-macro crate is the only
# member left. Listing it is optional (a path dependency inside the workspace directory becomes a
# member automatically) but explicit; the root package duckfn is the workspace root, not a member.
members = ["duckfn-macro"]

[workspace.package]
version = "0.0.18-dev.0"
edition = "2024"
rust-version = "1.86"
license = "MIT"
repository = "https://github.com/shijianjs/duckfn"
homepage = "https://github.com/shijianjs/duckfn"
authors = ["shijianjs"]

[lib]
# 只有 rlib —— 下游项目要的也就是它。
#
# 原生扩展的 cdylib 与 wasm 用的 staticlib 都不在这里，而在下面的 `[[example]] duckfn`：
#   1. crate-type 不能按 target 覆写，写进 lib 就意味着**每个下游项目**在编 wasm 时都要把
#      duckfn 的 cdylib 也链一遍；那条路下 rustc 不给 emcc 传 `-sSIDE_MODULE=2`，emcc 按独立
#      模块链接、去找一个并不存在的 main，直接报
#      `libstandalonewasm.a(__main_void.o): undefined symbol: main`。
#   2. 那两个产物本来就只是**本仓库自己**发扩展要用，下游不需要。
# 挪出去之后，下游只编一份 rlib，既不付多余的链接成本，也不必为 wasm 加任何 rustflags。
#
# rlib only — that is all a downstream project needs.
#
# The native extension's cdylib and the wasm staticlib live in the `[[example]] duckfn` target below,
# not here: (1) `crate-type` cannot be overridden per target, so listing them here makes **every
# downstream project** link duckfn's cdylib when it builds for wasm — and in that path rustc does not
# pass `-sSIDE_MODULE=2`, so emcc links a standalone module and fails with
# `libstandalonewasm.a(__main_void.o): undefined symbol: main`. (2) Those two artefacts exist only for
# shipping *this* extension. Downstream now builds one rlib: no extra link, no wasm rustflags.
crate-type = ["rlib"]

[[bin]]
# 命令行工具（导出 function_descriptions.csv）。它自己用 `#[path]` 再编一遍示例源码：直接依赖 rlib
# 时链接器可能把 inventory 的注册项整块丢掉，导出的 CSV 会静默变空。也因此它只包含
# `extension/mod.rs`，不含入口符号（见 test/extension/entry.rs）。
#
# 目标名是 `duckfn-cli` 而不是文件名的 `duckfn`：本包的 lib 是 cdylib，产物也叫 duckfn，
# Windows 上两者的 .pdb 会撞名（cargo 报 output filename collision）。下游项目的包名不同，
# 不会撞，所以模板里那个 bin 依旧叫 `duckfn`。
#
# The command-line tool (it exports function_descriptions.csv). It compiles the example sources again
# through `#[path]`, because depending on the rlib alone lets the linker drop the inventory
# registrations and the CSV would come out silently empty. That is also why it includes
# `extension/mod.rs` without the entry symbol (see test/extension/entry.rs).
#
# The target is named `duckfn-cli`, not `duckfn` like its file: this package's extension artefact is
# also called duckfn (see the `[[example]] duckfn` below), and on Windows the two .pdb files would
# collide (cargo reports an output filename collision). A downstream package has a different name and
# no collision, so the template's bin keeps the plain `duckfn`.
name = "duckfn-cli"
path = "src/bin/duckfn.rs"
required-features = ["quack"]

[[example]]
# 扩展产物本体：原生扩展的 cdylib（`duckfn.dll` / `libduckfn.so`）与 WebAssembly 用的
# staticlib（`libduckfn.a`）。crate-type 不能按 target 覆写，所以两个一起列 —— cargo 每次都把
# 两份都做出来，各平台取自己需要的那份（wasm 那一侧真正喂给 emcc 的是 .a）。
#
# 与下游模板（duckfn-extension-template）的做法一致：示例树由这个 target 编一遍，入口符号与
# inventory 注册项都只有一份；多编一遍会重复注册，wasm 上直接链接失败。
#
# The extension artefact itself: the native extension's cdylib (`duckfn.dll` / `libduckfn.so`) and the
# WebAssembly staticlib (`libduckfn.a`). crate-type cannot be overridden per target, so both are
# listed — cargo builds both and each platform takes the one it needs (on wasm, emcc consumes the .a).
#
# This mirrors the downstream template (duckfn-extension-template): the example tree is compiled once,
# here, so the entry symbol and the inventory registrations exist exactly once — a second copy would
# register everything twice and fail to link on wasm.
name = "duckfn"
path = "examples/duckfn.rs"
crate-type = ["cdylib", "staticlib"]
required-features = ["quack"]

[features]
default = []

# 命令行工具的开关：`cargo run --features quack --bin duckfn-cli -- function_descriptions` 用的 clap
# 与 csv（那个 bin 的文件在 src/bin/duckfn.rs，目标名见上面的 `[[bin]]`，本身也挂在 `quack` 上）。
# 只有扩展项目里的那个 bin 需要它，插件本体（cdylib）不需要；关掉时 duckfn 完全不依赖
# 这两个 crate，所以下游没用到 CLI 就不用打开。
#
# The command-line tool switch: clap and csv, used by
# `cargo run --features quack --bin duckfn-cli -- function_descriptions` (that bin's file is
# src/bin/duckfn.rs, its target name is set by the `[[bin]]` above, and it is itself gated on
# `quack`). Only the extension project's bin needs them,
# never the extension itself; with this off duckfn depends on neither crate, so downstream projects
# that never run the CLI need not enable it.
cli = ["dep:clap", "dep:csv"]

# DuckDB 1.5 新增能力的支持：开启 quack-rs 的 duckdb-1-5，从而拿到 1.5 的新逻辑类型
# （TypeId::TimeNs / Value::as_time_ns）与 COPY 函数相关的 *Info 类型。
# 宿主文件系统（duckfn::duck_vfs）**不在**这一档里，它由下面的 `owned-connection` 控制 ——
# 因为那一档真正要的东西是注册期的一条常驻连接，而它带着副作用。
# 要求 libduckdb-sys 使用 >= 1.5 的头文件。
#
# Support for what DuckDB 1.5 added: forwards to quack-rs' `duckdb-1-5` feature, which exposes the
# new logical types (`TypeId::TimeNs` / `Value::as_time_ns`) and the copy-function `*Info` types.
# The host file system (`duckfn::duck_vfs`) is **not** here: it needs a connection captured at
# registration time, which is what `owned-connection` below is about — that one carries side effects.
# Requires libduckdb-sys with >= 1.5 headers.
duckdb-1-5 = ["quack-rs/duckdb-1-5"]

# 注册期捕获的「自有长连接」（src/duck_vfs/capture.rs）：扩展加载时打开一条进程级常驻连接，
# 让拿不到客户端上下文的回调（首推聚合函数）也能访问宿主文件系统 ——
# `duckfn::duck_vfs::with_file_system` / `file_system` / `client_context` 与基于它的便捷读写。
#
# 为什么单开一档：`duckdb-1-5` 的其余能力（新逻辑类型、COPY 函数）都是纯粹的 API 面，
# 这一档却会**在进程里留一条永不释放的连接**，并且
#   1. 每次取用都要拿它上面的互斥锁，取用之间串行化（同一线程嵌套取用会死锁）；
#   2. 在「同一个线程里同步执行 DuckDB」的运行时里，注册期打开连接并重入会**直接死锁**，
#      表现为扩展 LOAD / 注册卡住不动 —— 已知一处就是 DuckDB-Wasm 的 Node blocking 绑定
#      （Node 的 worker 模式与浏览器正常，原生 CLI 也正常）。
# 所以只开 `duckdb-1-5` 的用户不该被动带上它；用得上文件系统时再显式打开。
#
# The owned long-lived connection captured at registration time (src/duck_vfs/capture.rs): a
# process-level, long-lived connection opened while the extension loads, so callbacks that get no
# client context — aggregates above all — can still reach the host file system:
# `duckfn::duck_vfs::with_file_system` / `file_system` / `client_context` and the convenience
# read/write helpers built on them.
#
# Why it is its own feature: the rest of `duckdb-1-5` (new logical types, copy functions) is pure API
# surface, while this one **keeps a connection alive for the life of the process** and
#   1. serializes every take-up on that connection's mutex (nesting it on one thread deadlocks);
#   2. **deadlocks outright** in a runtime that executes DuckDB synchronously on a single thread:
#      opening a connection during registration and then re-entering the engine hangs the extension
#      LOAD. The one known case is DuckDB-Wasm's Node blocking bindings (Node's worker mode and the
#      browser are fine, and so is the native CLI).
# A user who only wants `duckdb-1-5` should not inherit that; enable this when the file system is
# actually needed.
owned-connection = ["duckdb-1-5"]

# 与 chrono 的互操作：给 DuckDate / DuckTimestamp* / DuckTime 等时间包装类型加上
# `to_naive_date` / `from_naive_date` 这类双向转换方法（见 src/value_types/chrono_bridge.rs）。
# 默认关闭，因为多数扩展用不到 chrono；开启后 duckfn 会多一个可选依赖。
#
# Interop with chrono: adds bidirectional conversions (`to_naive_date` / `from_naive_date`, ...) to
# the time wrapper types such as DuckDate / DuckTimestamp* / DuckTime (see
# src/value_types/chrono_bridge.rs). Off by default because most extensions never need
# chrono; enabling it adds one optional dependency to duckfn.
chrono = ["dep:chrono"]

# 与 uuid crate 的互操作：DuckUuid <-> uuid::Uuid（见 src/value_types/uuid_bridge.rs）。
# 这一对是无损的（两边都是 128 位），因此不像时间桥那样返回 DuckResult。
#
# Interop with the `uuid` crate: DuckUuid <-> uuid::Uuid (see
# src/value_types/uuid_bridge.rs). The pair is lossless — both sides are 128 bits — so unlike
# the time bridge these conversions do not return a DuckResult.
uuid = ["dep:uuid"]

# 与 rust_decimal 的互操作：DuckDecimal<W, S> <-> rust_decimal::Decimal（见
# src/value_types/decimal_bridge.rs）。注意 rust_decimal 的尾数是 96 位（约 28~29 位有效数字），
# 装不下 DuckDB 允许的 DECIMAL(38, ...)，越界会返回错误。
#
# Interop with `rust_decimal`: DuckDecimal<W, S> <-> rust_decimal::Decimal (see
# src/value_types/decimal_bridge.rs). Note that rust_decimal's mantissa is 96 bits (about
# 28-29 significant digits), so it cannot hold every DECIMAL(38, ...) DuckDB allows; out-of-range
# values come back as an error.
rust_decimal = ["dep:rust_decimal"]

# 示例扩展与 CLI 的开关（示例源码在 test/extension/，CLI 在 src/bin/duckfn.rs）：它依赖 `all`，
# 因为示例把每一档可选能力都演示了一遍。
# 反过来 `all` **不**依赖它 —— `all` 是给下游用户用的，用户不需要示例与那些测试函数进自己的依赖树。
# 默认关闭还有一个原因：`required-features` 的失败是静默的（裸 `cargo build` 只会产出一个没有入口
# 符号的 cdylib，LOAD 时才报错），所以构建扩展的命令一律显式带上它 —— 不带上时示例源码在包里却
# 不参与编译，正好就是「只有源码、不生效」。
#
# The example extension and CLI switch (the example lives in test/extension/, the CLI in
# src/bin/duckfn.rs): it depends on `all`, since the example exercises every optional capability.
# The reverse does not hold — `all` is meant for downstream users, who have no use for the example
# and its test functions in their dependency tree. Being off by default also means `required-features`
# can silently skip the targets: a bare `cargo build` produces a cdylib without the entry-point
# symbol and only `LOAD` complains, so every command that builds the extension passes this feature
# explicitly. With it off, the example sources sit in the package without being compiled — exactly
# the intended "sources present, no effect" behaviour.
quack = ["all", "owned-connection"]

# 聚合开关：一次打开大部分可选 feature（含 `cli`）。**不含 `owned-connection`（即
# `duckfn::duck_vfs`）** —— 宿主文件系统在浏览器 / DuckDB-Wasm 上不可靠（存在性判定恒真、
# 裸写偏移错，详见 `src/duck_vfs` 模块文档），而它在原生上又能被 DuckDB 自身的读写 / 系统库
# 替代，所以不放进「全开」这一档，避免下游为用不上的能力付代价（进程级常驻连接 + 副作用）。
# 真正需要宿主文件系统的用户在 native 场景下显式打开 `owned-connection`。
#
# Aggregate switch: turns most optional features on at once (including `cli`). It deliberately does
# **not** include `owned-connection` (i.e. `duckfn::duck_vfs`): the host file system is unreliable
# under the browser / DuckDB-Wasm build (existence always true, raw-write offset broken — see the
# `src/duck_vfs` module docs), and on native DuckDB's own readers or the standard library cover the
# same need, so it is left out of "everything on" rather than charging every downstream user for an
# owned connection they may never use. Users who do want it, on native, enable `owned-connection`.
all = ["cli", "duckdb-1-5", "chrono", "uuid", "rust_decimal"]

[dependencies]
quack-rs = "0.16.0"

# `cli` feature 用的命令行解析（derive 风格：一个结构体 + 一个枚举就是一个 CLI）。
#
# Command-line parsing behind the `cli` feature (the derive style: one struct plus one enum is a
# whole CLI).
clap = { version = "4", features = ["derive"], optional = true }

# `cli` feature 用的 CSV 写出：crates.io 上的纯 Rust 实现，不牵扯系统库或 FFI。
# 转义规则（逗号 / 引号 / 换行的处理）交给它，不要自己拼字符串。
#
# CSV writing behind the `cli` feature: a pure-Rust implementation from crates.io, with no system
# library or FFI involved. Quoting and escaping are its job, not something to hand-roll here.
csv = { version = "1", optional = true }

# chrono feature 用的可选依赖：只需要核心的日期/时间类型，不需要 clock（拿系统时间）与
# oldtime，因此关掉默认 feature 只留 std。
#
# Optional dependency of the `chrono` feature: only the core date/time types are needed, not
# `clock` (system time) or `oldtime`, so the default features are off and only `std` is kept.
chrono = { version = "0.4.31", default-features = false, features = ["std"], optional = true }

# uuid feature 用的可选依赖：默认 feature 为空，不需要 uuid 的 v4 / fast-rng / serde 等。
#
# Optional dependency of the `uuid` feature: its default feature set is empty, and the `v4` /
# `fast-rng` / `serde` features are not needed here.
uuid = { version = "1", optional = true }

# rust_decimal feature 用的可选依赖。
#
# Optional dependency of the `rust_decimal` feature.
rust_decimal = { version = "1", optional = true }

# loadable-extension 功能
# libduckdb-sys 加上 features = ["loadable-extension"] 从根本上改变了 DuckDB API 函数的工作方式：
# Without feature:  duckdb_query(...)  →  calls linked libduckdb directly
# With feature:     duckdb_query(...)  →  dispatches through an AtomicPtr table
# AtomicPtr 表初始值为空。DuckDB 通过调用来填充它。 duckdb_rs_extension_api_init 。
# headers only — no linked library
libduckdb-sys = { version = ">=1.4.4, <2", features = ["loadable-extension"] }
#libduckdb-sys = { version = "1.10506.0", features = ["loadable-extension"] }

#tuple-transpose = "0.1.0"

# 对应duckdb的map语义
indexmap = "2"

# 过程宏 crate 与本 crate 同属一个 workspace，且是旁挂目录；发版脚本靠这里的精确 pin
# （=X.Y.Z）与 crate 版本一起改，所以路径是相对本清单的 duckfn-macro/。
#
# The proc-macro crate is a sibling directory inside this workspace; the release script rewrites
# this exact pin (=X.Y.Z) together with the crate version, hence the manifest-relative path.
duckfn-macro = { version = "=0.0.18-dev.0", path = "duckfn-macro" }

inventory = "0.3"
itertools = "0.15"

[profile.release]
## 下面两个官方模板的
lto = true
strip = true

## 下面三个是quack-rs加的
#panic = "abort"             # required — panics across FFI are undefined behavior
#opt-level = 3
#codegen-units = 1
